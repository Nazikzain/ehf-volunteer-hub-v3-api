  /users/{id}/invitation:
    delete:
      tags:
      - users
      operationId: deleteUsersIdInvitation
      summary: Cancel outstanding invitations of an invited account.
      security:
      - sessionCookie: []
      x-action-type: deactivate
      x-permission: invitations.cancel
      x-scope: organisation
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
