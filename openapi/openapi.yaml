components:
  headers:
    XRequestId:
      description: Server-generated request ID (ULID); also in meta.request_id or error.request_id.
      schema:
        $ref: '#/components/schemas/RequestId'
  responses:
    Error:
      description: Standard error response (API §4.3).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RequestId:
      type: string
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    Meta:
      type: object
      required:
      - request_id
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        field_sets:
          type: array
          items:
            type: string
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    HealthResponse:
      type: object
      required:
      - data
      - meta
      additionalProperties: false
      properties:
        data:
          type: object
          required:
          - status
          additionalProperties: false
          properties:
            status:
              const: ok
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorCode:
      description: Stable error codes, exactly as API V1.3.1 §4.3.
      type: string
      enum:
      - malformed_json
      - unknown_field
      - unauthenticated
      - session_expired
      - invalid_credentials
      - forbidden
      - csrf_invalid
      - origin_not_allowed
      - self_decision_forbidden
      - self_grant_forbidden
      - owner_authority_required
      - final_owner_protected
      - password_confirmation_required
      - field_not_permitted
      - format_not_permitted
      - report_not_permitted
      - not_found
      - invalid_transition
      - stale_version
      - duplicate
      - active_certificate_exists
      - not_eligible
      - not_eligible_for_provisioning
      - account_exists
      - period_completed
      - locked_by_certificate
      - token_used
      - token_expired
      - export_expired
      - payload_too_large
      - unsupported_media_type
      - validation_failed
      - idempotency_mismatch
      - combination_not_allowed
      - use_operational_exception
      - field_not_editable
      - too_many_files
      - too_many_rows
      - password_policy
      - rate_limited
      - internal_error
      - maintenance
    ErrorDetail:
      type: object
      required:
      - field
      - code
      - message
      additionalProperties: false
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          - request_id
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              $ref: '#/components/schemas/RequestId'
    SuccessResponse:
      type: object
      required:
      - data
      - meta
      additionalProperties: false
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    Volunteer:
      type: object
      description: A volunteer record. Fields the caller may not read are omitted (API §6.7); x-field-set names
        each field's set. Never contains notes or account data.
      required:
      - id
      - reference
      - status
      - version
      properties:
        id:
          type: integer
          minimum: 1
        reference:
          type: string
          pattern: ^V-[0-9]{6}$
        status:
          type: string
          enum:
          - draft
          - accepted
          - active
          - inactive
          - ended
          - withdrawn
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
        editable_fields:
          type: array
          items:
            type: string
          description: GET /me/profile only (R12).
        full_name:
          type: string
          minLength: 1
          maxLength: 150
          x-field-set: basic
        preferred_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
          x-field-set: basic
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
          x-field-set: contact
        phone:
          type:
          - string
          - 'null'
          maxLength: 40
          pattern: ^\+?[0-9][0-9 ()\-]{4,38}[0-9]$
          x-field-set: contact
        skills:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          x-field-set: basic
        languages:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          x-field-set: basic
        interests:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          x-field-set: basic
        availability:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - specific_days
              - flexible
            days:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
              uniqueItems: true
          x-field-set: basic
        address_line1:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 150
          x-field-set: sensitive
        address_line2:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 150
          x-field-set: sensitive
        town:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
          x-field-set: sensitive
        postcode:
          type:
          - string
          - 'null'
          maxLength: 12
          x-field-set: sensitive
        nationality:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 80
          x-field-set: sensitive
        emergency_contact_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 150
          x-field-set: sensitive
        emergency_contact_phone:
          type:
          - string
          - 'null'
          maxLength: 40
          pattern: ^\+?[0-9][0-9 ()\-]{4,38}[0-9]$
          x-field-set: sensitive
        emergency_contact_relationship:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 60
          x-field-set: sensitive
    ProvisioningCandidate:
      type: object
      additionalProperties: false
      required:
      - volunteer_id
      - volunteer_reference
      - name
      - invitation_email
      properties:
        volunteer_id:
          type: integer
          minimum: 1
        volunteer_reference:
          type: string
        name:
          type: string
        invitation_email:
          type:
          - string
          - 'null'
          format: email
          description: 'AC-6 Option 1 (approved clarification of API V1.3.1 §7.2; no endpoint, permission, guard
            or audit change): nullable. Populated only from the volunteer''s recorded contact email, shown in full
            to holders of accounts.provision (R18); null when none is recorded. When null, POST /volunteers/{id}/portal-account
            must include invitation_email, or it is refused with 422 validation_failed.'
    PortalAccountResult:
      type: object
      additionalProperties: false
      required:
      - user
      - invitation
      properties:
        user:
          type: object
          additionalProperties: false
          required:
          - id
          - email
          - status
          properties:
            id:
              type: integer
              minimum: 1
            email:
              type: string
              format: email
            status:
              type: string
              const: invited
        invitation:
          type:
          - object
          - 'null'
          properties:
            expires_at:
              type: string
              format: date-time
          description: null when no invitation was sent (send_invitation false). Sending needs A5/A11.
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ehf_session
      description: Server-side session. State-changing requests also need an allowed Origin and X-CSRF-Token (from
        GET /auth/session).
