  /users:
    get:
      tags:
      - users
      operationId: getUsers
      summary: List accounts (account data only).
      security:
      - sessionCookie: []
      x-action-type: view
      x-permission: accounts.view
      x-scope: organisation
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: none
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
