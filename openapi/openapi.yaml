openapi: 3.1.0
info:
  title: EHF Volunteer Hub V3 API
  version: 0.5.0
  description: 'Contract for the EHF Volunteer Hub V3 backend, written from Backend API Architecture Specification
    V1.3.1 (approved). Paths are added phase by phase after each approval gate (API §12). Phase 4: authentication
    and sessions, accounts, roles, grants, sessions, System Owner governance, operational exceptions, audit logs
    and system health. Phase 5: volunteer records, portal provisioning and the own profile. Endpoints blocked by
    an unresolved decision are not included (docs/phase-4-decisions.md, docs/phase-5-decisions.md).'
  x-architecture-specification: Backend API Architecture V1.3.1
servers:
- url: /api/v3
  description: Every route is under /api/v3 (API §2.2).
tags:
- name: audit-logs
- name: auth
- name: health
- name: me
- name: operational-exceptions
- name: permissions
- name: portal-provisioning
- name: roles
- name: sessions
- name: system
- name: system-owners
- name: users
- name: volunteers
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: Minimal availability check (public).
      security: []
      x-action-type: view
      x-permission: public
      x-scope: none
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: none
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /system/health:
    get:
      tags:
      - system
      operationId: getSystemHealth
      summary: 'Technical health: versions, migration level, storage, email and queue state.'
      security:
      - sessionCookie: []
      x-action-type: view
      x-permission: system.health
      x-scope: organisation
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: none
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/session:
    get:
      tags:
      - auth
      operationId: getAuthSession
      summary: 'Session state: user, roles, permissions, field access and CSRF token.'
      security: []
      x-action-type: view
      x-permission: public
      x-scope: none
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: none
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      tags:
      - auth
      operationId: postAuthLogin
      summary: Sign in. Every failure returns the same 401 invalid_credentials. Rate-limited (A7). 503 while sign-in
        is not configured.
      security: []
      x-action-type: create
      x-permission: public
      x-scope: none
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: auth.login.succeeded / auth.login.failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
              - email
              - password
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags:
      - auth
      operationId: postAuthLogout
      summary: Sign out (ends this session).
      security:
      - sessionCookie: []
      x-action-type: deactivate
      x-permission: signed_in
      x-scope: none
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: auth.logout
      responses:
        '204':
          description: Done.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/password/change:
    post:
      tags:
      - auth
      operationId: postAuthPasswordChange
      summary: Change own password; other sessions end.
      security:
      - sessionCookie: []
      x-action-type: edit
      x-permission: signed_in
      x-scope: none
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: auth.password.changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                new_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
              - current_password
              - new_password
      responses:
        '204':
          description: Done.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/invitations/inspect:
    post:
      tags:
      - auth
      operationId: postAuthInvitationsInspect
      summary: Check an invitation token (rate-limited).
      security: []
      x-action-type: view
      x-permission: public
      x-scope: none
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: none
      requestBody:
