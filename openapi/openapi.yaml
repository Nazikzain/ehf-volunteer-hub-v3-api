        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 120
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
              required:
              - version
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
