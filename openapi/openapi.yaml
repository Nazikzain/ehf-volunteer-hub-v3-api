        '500':
          $ref: '#/components/responses/Error'
  /users/{id}/suspend:
    post:
      tags:
      - users
      operationId: postUsersIdSuspend
      summary: Suspend; ends sessions. Not one's own account.
      security:
      - sessionCookie: []
      x-action-type: deactivate
      x-permission: accounts.suspend
      x-scope: organisation
      x-context: none
      x-field-sets: []
      x-guards:
