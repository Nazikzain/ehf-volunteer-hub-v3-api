        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /users/{id}:
    get:
      tags:
      - users
      operationId: getUsersId
      summary: Account detail (account data only).
      security:
