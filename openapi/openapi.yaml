        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - users
      operationId: patchUsersId
      summary: Edit the display name. Changing the sign-in email is not available (422 field_not_editable).
      security:
      - sessionCookie: []
      x-action-type: edit
      x-permission: accounts.edit
      x-scope: organisation
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
      x-audit: account.updated
      parameters:
