          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /users/{id}/reactivate:
    post:
      tags:
      - users
      operationId: postUsersIdReactivate
      summary: Reactivate a suspended account.
      security:
      - sessionCookie: []
      x-action-type: edit
      x-permission: accounts.reactivate
      x-scope: organisation
      x-context: none
      x-field-sets: []
      x-guards: []
      x-workflow-dependency: none
