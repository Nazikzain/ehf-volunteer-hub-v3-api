        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /users/{id}/deactivate:
    post:
      tags:
      - users
      operationId: postUsersIdDeactivate
      summary: Deactivate; ends sessions. Not one's own account.
      security:
      - sessionCookie: []
      x-action-type: deactivate
      x-permission: accounts.deactivate
      x-scope: organisation
      x-context: none
      x-field-sets: []
      x-guards:
      - G7
      x-workflow-dependency: none
      x-audit: account.deactivated
      parameters:
      - name: id
        in: path
