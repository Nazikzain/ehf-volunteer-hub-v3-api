components:
  headers:
    XRequestId:
      description: Server-generated request ID (ULID); also in meta.request_id or error.request_id.
      schema:
        $ref: '#/components/schemas/RequestId'
  responses:
    Error:
      description: Standard error response (API §4.3).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RequestId:
      type: string
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    Meta:
      type: object
      required:
      - request_id
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        field_sets:
          type: array
          items:
            type: string
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    HealthResponse:
      type: object
      required:
      - data
      - meta
      additionalProperties: false
      properties:
        data:
          type: object
          required:
          - status
          additionalProperties: false
          properties:
            status:
              const: ok
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorCode:
      description: Stable error codes, exactly as API V1.3.1 §4.3.
      type: string
      enum:
      - malformed_json
      - unknown_field
      - unauthenticated
      - session_expired
      - invalid_credentials
      - forbidden
      - csrf_invalid
      - origin_not_allowed
      - self_decision_forbidden
      - self_grant_forbidden
      - owner_authority_required
      - final_owner_protected
      - password_confirmation_required
      - field_not_permitted
      - format_not_permitted
      - report_not_permitted
      - not_found
      - invalid_transition
      - stale_version
      - duplicate
      - active_certificate_exists
      - not_eligible
      - not_eligible_for_provisioning
      - account_exists
      - period_completed
      - locked_by_certificate
      - token_used
      - token_expired
      - export_expired
      - payload_too_large
      - unsupported_media_type
      - validation_failed
      - idempotency_mismatch
      - combination_not_allowed
      - use_operational_exception
      - field_not_editable
      - too_many_files
      - too_many_rows
      - password_policy
      - rate_limited
      - internal_error
      - maintenance
    ErrorDetail:
      type: object
      required:
      - field
      - code
      - message
      additionalProperties: false
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          - request_id
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              $ref: '#/components/schemas/RequestId'
    SuccessResponse:
      type: object
      required:
      - data
      - meta
      additionalProperties: false
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ehf_session
      description: Server-side session. State-changing requests also need an allowed Origin and X-CSRF-Token (from
        GET /auth/session).
